version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: screensentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: dev_password_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d screensentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sentinel_dev
      MINIO_ROOT_PASSWORD: dev_password_change_me
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  token-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.token-service
    ports:
      - "3001:3001"
    environment:
      TOKEN_SERVICE_PORT: 3001
      DATABASE_URL: postgresql://sentinel:dev_password_change_me@postgres:5432/screensentinel
      REDIS_URL: redis://redis:6379
      SERVER_SECRET: dev_secret_change_in_production_64chars_minimum_please
      JWT_PRIVATE_KEY_PATH: /app/.keys/private.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  extraction-api:
    build:
      context: ../../packages/extraction-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sentinel:dev_password_change_me@postgres:5432/screensentinel
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: sentinel_dev
      S3_SECRET_KEY: dev_password_change_me
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
