name: CI
on: [push, pull_request]

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cd packages/sdk && pnpm run typecheck
      - run: cd packages/sdk && pnpm run test
      - run: cd packages/sdk && pnpm run build

  extraction-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r packages/extraction-api/requirements.txt
      - run: pip install -r packages/extraction-api/requirements-dev.txt
      - run: cd packages/extraction-api && python -m pytest tests/ -v
